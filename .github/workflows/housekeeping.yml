name: Housekeeping ping
on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes: resend queued emails, retry webhooks, release stock held by unpaid orders
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the housekeeping endpoint
        run: |
          [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ] || { echo "Add the SITE_URL and CRON_SECRET repository secrets first"; exit 1; }
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/maintenance"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
